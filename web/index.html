<!DOCTYPE html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Nexia-List — local-first spatial knowledge management">
    <meta name="theme-color" content="#1a1a2e">
    <title>Nexia-List</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <noscript>Nexia-List is a local-first app that runs entirely in your browser and requires JavaScript.</noscript>
    <div id="root" aria-live="polite"></div>
    <script type="module">
      // The TEA host and the Nexia host install the primitives the compiled
      // AffineScript app calls; importing app.bun.js then runs its `main`
      // (the Bun-ESM backend invokes `main` on load), mounting on #root.
      import "./tea_host.js";
      import "./nexia_host.js";
      import "./app.bun.js";
      if ("serviceWorker" in navigator) {
        addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {}));
      }
    </script>
  </body>
</html>
