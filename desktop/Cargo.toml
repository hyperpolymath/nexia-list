[package]
name = "nexia-desktop"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Nexia-List desktop application — Gossamer webview shell"

[dependencies]
gossamer-rs = { path = "../../gossamer/bindings/rust" }
nexia-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
