# SPDX-License-Identifier: MPL-2.0
# Product CI (UI/web): compiles the ReScript UI under Bun, builds the wasm
# core, runs the UI + contract tests, and produces the web bundle.
name: ui-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: rescript + wasm + bun test + bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install stable Rust with wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            target
          key: rust-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-bindgen-cli
        run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Compile ReScript
        run: bun run build:res

      - name: Build wasm core
        run: bun run build:wasm

      - name: UI + contract tests
        run: bun run test:ui

      - name: Bundle web app
        run: bun run build:web

      - name: Lint
        run: bun run lint
