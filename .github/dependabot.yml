version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"
  # Rust core crate. NOTE: deliberately no entry for /desktop — its path
  # dependency on an external sibling checkout (../../gossamer) would make
  # dependabot error.
  - package-ecosystem: "cargo"
    directory: "/core"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"
