# SPDX-License-Identifier: MPL-2.0
[package]
name = "nexia-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Core engine for Nexia-List knowledge management"
repository = "https://github.com/hyperpolymath/nexia-list"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = [
    "wasm-bindgen",
    "console_error_panic_hook",
    "serde-wasm-bindgen",
    "chrono/wasmbind",
    "uuid/js",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: exact f64 parsing, so canvas geometry and numeric
# attributes reload bit-identical (the default parser can drift by an ULP).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"

# Optional WASM support
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[dev-dependencies]
pretty_assertions = "1.0"
tempfile = "3.0"
proptest = "1"

[[bench]]
name = "notebook_perf"
harness = false
